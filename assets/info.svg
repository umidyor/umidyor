<text class="role3" x="0" y="120" font-size="17" fill="#39ff14" letter-spacing="2" filter="url(#glow)">&gt;_ BACKEND DEV<tspan class="cur" fill="#fff"> &#9608;</tspan></text>

  <line x1="0" y1="140" x2="500" y2="140" stroke="#fcee0a" stroke-width="1.5" class="dline"/>
