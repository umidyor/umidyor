<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" font-family="'Courier New',monospace">
<defs>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#16323a" stroke-width="1" opacity="0.45"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#0c0d16"/></linearGradient>
<style><![CDATA[
  @keyframes scan{0%{transform:translateY(-10px)}100%{transform:translateY(150px)}} .scan{animation:scan 3.5s linear infinite;}
  @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.5}98%{opacity:.9}} .frame{animation:flick 3s linear infinite;}
  @keyframes gR{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(-3px,1px)}75%{transform:translate(1px,0)}}
  @keyframes gB{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,0)}}
  .gr{animation:gR 2.4s steps(2) infinite;} .gb{animation:gB 2.4s steps(2) infinite;}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .cur{animation:blink 1s steps(1) infinite;}
  @keyframes dash{to{stroke-dashoffset:-40}} .dline{stroke-dasharray:8 6;animation:dash 1.2s linear infinite;}
  
  @keyframes r1{0%,27%{opacity:1}33%,94%{opacity:0}100%{opacity:1}}
  @keyframes r2{0%,30%{opacity:0}36%,60%{opacity:1}66%,100%{opacity:0}}
  @keyframes r3{0%,63%{opacity:0}69%,93%{opacity:1}99%,100%{opacity:0}}
  .role1{animation:r1 9s infinite;} .role2{animation:r2 9s infinite;opacity:0;} .role3{animation:r3 9s infinite;opacity:0;}

]]></style></defs>
<rect width="960" height="150" fill="url(#bg)"/><rect width="960" height="150" fill="url(#grid)"/>
<rect class="scan" width="960" height="2" fill="#ff003c" opacity="0.15"/><g class="frame"><rect x="6" y="6" width="948" height="138" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <path d="M6 34V6H34" fill="none" stroke="#ff003c" stroke-width="4"/><path d="M954 34V6H926" fill="none" stroke="#ff003c" stroke-width="4"/>
  <path d="M6 116V144H34" fill="none" stroke="#ff003c" stroke-width="4"/><path d="M954 116V144H926" fill="none" stroke="#ff003c" stroke-width="4"/></g>
<g font-size="34" font-weight="bold" letter-spacing="3">
  <text class="gr" x="480.0" y="78" text-anchor="middle" fill="#ff003c">// END OF TRANSMISSION</text>
  <text class="gb" x="480.0" y="78" text-anchor="middle" fill="#00f0ff">// END OF TRANSMISSION</text>
  <text x="480.0" y="78" text-anchor="middle" fill="#fcee0a" filter="url(#glow)">// END OF TRANSMISSION</text></g>
<text x="480.0" y="112" text-anchor="middle" font-size="15" fill="#f2f2f2" letter-spacing="3">THANKS FOR JACKING IN &#9642; STAY SAFE OUT THERE, CHOOM</text>
</svg>