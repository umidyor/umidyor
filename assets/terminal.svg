<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="'Courier New',monospace">
<defs>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
  <path d="M26 0H0V26" fill="none" stroke="#16323a" stroke-width="1" opacity="0.45"/>
</pattern>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07080d"/><stop offset="1" stop-color="#0c0d16"/></linearGradient>
<style><![CDATA[
  @keyframes scan{0%{transform:translateY(-10px)}100%{transform:translateY(330px)}}
  .scan{animation:scan 3.5s linear infinite;}
  @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.5}98%{opacity:.9}}
  .frame{animation:flick 3s linear infinite;}
  @keyframes gR{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(-3px,1px)}75%{transform:translate(1px,0)}}
  @keyframes gB{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,0)}}
  .gr{animation:gR 2.4s steps(2) infinite;} .gb{animation:gB 2.4s steps(2) infinite;}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .cur{animation:blink 1s steps(1) infinite;}
  @keyframes type{from{width:0}to{width:100%}}
  @keyframes dash{to{stroke-dashoffset:-40}}
  .dline{stroke-dasharray:8 6;animation:dash 1.2s linear infinite;}
  @keyframes rowin{0%{opacity:0}100%{opacity:1}}
  .r1{animation:rowin .5s both;animation-delay:.3s} .r2{animation:rowin .5s both;animation-delay:.6s}
  .r3{animation:rowin .5s both;animation-delay:.9s} .r4{animation:rowin .5s both;animation-delay:1.2s}
  .r5{animation:rowin .5s both;animation-delay:1.5s} .r6{animation:rowin .5s both;animation-delay:1.8s}
  .r7{animation:rowin .5s both;animation-delay:2.1s}
]]></style></defs>
<rect width="960" height="330" fill="url(#bg)"/><rect width="960" height="330" fill="url(#grid)"/>
<g class="frame">
  <rect x="6" y="6" width="948" height="318" fill="none" stroke="#fcee0a" stroke-width="2"/>
  <path d="M6 34V6H34" fill="none" stroke="#ff003c" stroke-width="4"/>
  <path d="M954 34V6H926" fill="none" stroke="#ff003c" stroke-width="4"/>
  <path d="M6 296V324H34" fill="none" stroke="#ff003c" stroke-width="4"/>
  <path d="M954 296V324H926" fill="none" stroke="#ff003c" stroke-width="4"/>
</g>
<rect x="18" y="18" width="924" height="30" fill="#fcee0a"/>
<circle cx="40" cy="33" r="6" fill="#ff003c"/><circle cx="62" cy="33" r="6" fill="#0c0d16"/><circle cx="84" cy="33" r="6" fill="#0c0d16"/>
<text x="480.0" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#07080d" letter-spacing="2">root@night-city:~/umidyor$ cat profile.json</text>
